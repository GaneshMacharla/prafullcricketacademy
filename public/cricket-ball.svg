<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#580f0f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#ballShine)" stroke="#3f0707" stroke-width="2"/>
  <!-- Cricket Ball Curved Seam -->
  <path d="M 22 18 C 38 32, 38 68, 22 82" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2 3" stroke-linecap="round"/>
  <path d="M 20 19 C 36 33, 36 67, 20 81" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 24 17 C 40 31, 40 69, 24 83" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Highlight reflection -->
  <ellipse cx="38" cy="28" rx="14" ry="7" transform="rotate(-30 38 28)" fill="#ffffff" fill-opacity="0.25"/>
</svg>
